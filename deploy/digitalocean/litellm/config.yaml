# LiteLLM proxy config for NEXT GENT.
#
# Tier names are what agents and gcr-api-clean ask for (Paperclip agents'
# model setting; gcr-api-clean LITELLM_MODEL / LITELLM_CONCIERGE_MODEL).
# Which real model each tier calls comes from env (env/litellm.env), so no
# vendor model name lives in a file. Provider keys are read by LiteLLM from
# their standard env names (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...).
#
# Per-company keys: Paperclip calls /key/generate with the master key at
# sign-up (metadata.company_id, budget from LITELLM_COMPANY_BUDGET); each
# company's agents use only their own key. Spend per key is what
# gcr-api-clean pulls into usage credits (LITELLM_USAGE_PULL=true).
#
# After the first start, check the tiers resolved:
#   curl -s -H "Authorization: Bearer $LITELLM_MASTER_KEY" https://$LITELLM_DOMAIN/model/info

model_list:
  - model_name: fast
    litellm_params:
      model: os.environ/LITELLM_MODEL_FAST
  - model_name: reasoning
    litellm_params:
      model: os.environ/LITELLM_MODEL_REASONING
  - model_name: coding
    litellm_params:
      model: os.environ/LITELLM_MODEL_CODING

litellm_settings:
  # Ignore request parameters a given provider does not support instead of failing.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
